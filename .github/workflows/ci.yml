name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Unit & Service Tests
        run: npm test -- tests/services/ tests/utils/ tests/middleware/
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_ci_12345678901234567890
          COOKIE_SECRET: test_cookie_secret_ci_1234567890123456
