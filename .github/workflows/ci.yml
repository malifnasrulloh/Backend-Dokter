name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      REDIS_ENABLED: 'false'
      DISABLE_QUERY_LOG: 'true'
      SECRETTOKEN: ci-test-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx biome check .

      - name: Audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test
